<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="nativaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1626" />
      <stop offset="50%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#04070d" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="nativaBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Globe / Network Nodes Gradient -->
    <linearGradient id="nativaEmeraldCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <radialGradient id="nativaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow Behind Badge -->
  <rect x="28" y="28" width="456" height="456" rx="114" fill="url(#nativaGlow)" />

  <!-- Badge Squircle Container -->
  <rect x="36" y="36" width="440" height="440" rx="110" fill="url(#nativaBg)" stroke="url(#nativaBorder)" stroke-width="12" />

  <!-- Icono de Lenguaje Global / Nodo de Conexión Neural -->
  <g id="nativa-language-node" transform="translate(256, 256)">
    
    <!-- Outer Globe Meridian Ring -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="url(#nativaEmeraldCyan)" stroke-width="18" opacity="0.95" />

    <!-- Equatorial Flow Ellipse -->
    <ellipse cx="0" cy="0" rx="140" ry="52" fill="none" stroke="url(#nativaEmeraldCyan)" stroke-width="14" stroke-dasharray="8 6" opacity="0.8" />

    <!-- Vertical Central Meridian -->
    <ellipse cx="0" cy="0" rx="58" ry="140" fill="none" stroke="url(#nativaEmeraldCyan)" stroke-width="14" opacity="0.85" />

    <!-- Diagonal Network Connection Pathways -->
    <line x1="-80" y1="-70" x2="80" y2="70" stroke="#06b6d4" stroke-width="8" opacity="0.75" />
    <line x1="-80" y1="70" x2="80" y2="-70" stroke="#10b981" stroke-width="8" opacity="0.75" />

    <!-- Central Language Comprehension Core Node -->
    <circle cx="0" cy="0" r="30" fill="#04070d" stroke="url(#nativaEmeraldCyan)" stroke-width="12" />
    <circle cx="0" cy="0" r="14" fill="#38bdf8" />

    <!-- Satellite Interconnected Acquisition Nodes -->
    <circle cx="-80" cy="-70" r="12" fill="#34d399" />
    <circle cx="80" cy="-70" r="12" fill="#06b6d4" />
    <circle cx="-80" cy="70" r="12" fill="#06b6d4" />
    <circle cx="80" cy="70" r="12" fill="#34d399" />

    <circle cx="0" cy="-140" r="10" fill="#38bdf8" />
    <circle cx="0" cy="140" r="10" fill="#38bdf8" />
    <circle cx="-140" cy="0" r="10" fill="#10b981" />
    <circle cx="140" cy="0" r="10" fill="#06b6d4" />

  </g>
</svg>
