<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322" />
      <stop offset="50%" stop-color="#080c16" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glyph Gradients -->
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow Behind Card -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#centerGlow)" />

  <!-- Badge Background -->
  <rect x="40" y="40" width="432" height="432" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Monogram F + Soundwave Stream -->
  <g id="fluentia-glyph">
    <!-- Vertical Spine of F -->
    <line x1="168" y1="140" x2="168" y2="372" stroke="url(#glyphGrad)" stroke-width="44" stroke-linecap="round" />

    <!-- Top Flow Bar of F -->
    <path d="M 168 156 C 216 132, 276 132, 332 156" fill="none" stroke="url(#glyphGrad)" stroke-width="44" stroke-linecap="round" />

    <!-- Middle Pulse Bar of F -->
    <path d="M 168 256 C 210 240, 248 240, 286 256" fill="none" stroke="url(#glyphGrad)" stroke-width="42" stroke-linecap="round" />

    <!-- Acoustic Wave 1 (Resonant Inner Wave) -->
    <path d="M 338 220 C 352 238, 352 274, 338 292" fill="none" stroke="url(#waveGrad)" stroke-width="34" stroke-linecap="round" />

    <!-- Acoustic Wave 2 (Resonant Outer Wave) -->
    <path d="M 384 184 C 412 214, 412 298, 384 328" fill="none" stroke="url(#waveGrad)" stroke-width="34" stroke-linecap="round" />

    <!-- Neural Spark / Comprehension Node -->
    <circle cx="366" cy="132" r="14" fill="#38bdf8" />
  </g>
</svg>
